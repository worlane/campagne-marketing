<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Primo | Le luxe sans le découvert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Arrière-plan plein écran avec overlay sombre pour la lisibilité */
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1547949003-9792a18a2601?auto=format&fit=crop&w=1920&q=90');
            background-size: cover;
            background-position: center;
        }

        /* Animation de pulsation douce sur le bouton */
        @keyframes soft-pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .btn-luxury {
            animation: soft-pulse 2s infinite;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-luxury:hover {
            transform: scale(1.05) translateY(-5px);
            background-color: #f59e0b; /* Amber 500 */
            color: white;
        }
    </style>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">

    <nav class="absolute top-0 w-full z-50 flex justify-between items-center px-6 md:px-12 py-8">
        <div class="text-2xl md:text-3xl font-extrabold tracking-tighter text-white">
            SEGUNDO<span class="text-amber-500">PRIMO</span>
        </div>
        <div class="hidden md:flex space-x-8 items-center text-white/90 text-[11px] font-bold uppercase tracking-[0.3em]">
            <a href="#" class="hover:text-amber-500 transition">Nouveautés</a>
            <a href="#" class="hover:text-amber-500 transition">Sacs Iconiques</a>
            <a href="#" class="text-amber-500 border-b-2 border-amber-500 pb-1 font-black">Moins de 300€</a>
        </div>
        <div class="flex items-center space-x-4">
            <button class="bg-white/10 backdrop-blur-md border border-white/20 text-white px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">
                Vendre
            </button>
        </div>
    </nav>

    <header class="hero-section h-screen w-full flex items-center justify-center relative">
        
        <div class="text-center px-4 max-w-6xl">
            <div class="inline-flex items-center space-x-2 mb-8 px-4 py-2 bg-black/30 backdrop-blur-xl border border-white/10 rounded-full animate-bounce">
                <span class="flex h-2 w-2 rounded-full bg-green-400"></span>
                <p class="text-[10px] md:text-xs font-bold text-white uppercase tracking-widest">
                    +3000 étudiantes certifiées ce mois-ci
                </p>
            </div>

            <h1 class="text-5xl md:text-[100px] lg:text-[130px] font-serif text-white leading-[0.9] mb-10 tracking-tighter">
                Le luxe sans le <br>
                <span class="italic text-amber-500 font-light opacity-90">découvert.</span>
            </h1>

            <p class="text-white/80 text-lg md:text-2xl mb-14 max-w-2xl mx-auto font-light leading-snug">
                Accédez aux pièces iconiques de seconde main, <br class="hidden md:block"> 
                expertisées physiquement et garanties à vie.
            </p>

            <button class="btn-luxury bg-white text-black px-12 md:px-20 py-6 md:py-8 rounded-full text-lg md:text-xl font-black uppercase tracking-[0.2em] shadow-2xl">
                Trouver mon sac
            </button>
            
            <div class="mt-12 flex justify-center items-center space-x-8 text-white/50">
                <div class="flex flex-col items-center">
                    <span class="text-lg font-bold text-white">100%</span>
                    <span class="text-[9px] uppercase tracking-tighter">Authentifié</span>
                </div>
                <div class="h-8 w-[1px] bg-white/20"></div>
                <div class="flex flex-col items-center">
                    <span class="text-lg font-bold text-white">4.9/5</span>
                    <span class="text-[9px] uppercase tracking-tighter">Avis Étudiants</span>
                </div>
                <div class="h-8 w-[1px] bg-white/20"></div>
                <div class="flex flex-col items-center">
                    <span class="text-lg font-bold text-white">3x</span>
                    <span class="text-[9px] uppercase tracking-tighter">Sans Frais</span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-8 w-full flex justify-center">
            <div class="w-6 h-10 border-2 border-white/30 rounded-full flex justify-center pt-2">
                <div class="w-1 h-2 bg-white rounded-full animate-bounce"></div>
            </div>
        </div>
    </header>

</body>
</html>
