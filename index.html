<head>

  <title>Oasis Studio – Architecture & Design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #050608;
      --accent: #d4a056;
      --accent-soft: #f3d7a2;
      --text: #f7f3ea;
      --muted: #a9b0c2;
      --shadow-3d: 0 18px 40px rgba(0, 0, 0, 0.55);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #151a24 0, #050608 55%);
      color: var(--text);
    }

    a { text-decoration: none; color: inherit; }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      border-radius: 999px;

      border: 1px solid rgba(212, 160, 86, 0.35);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 16px;
      z-index: 10;
    }

      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--accent-soft);
    }
