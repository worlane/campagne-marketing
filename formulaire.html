<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Segundo Primo | Débloquer l'Exclusivité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
        }

        /* Image de fond : Le moment de l'ouverture du colis, désirabilité concrète */
        .bg-mystery {
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), 
                        url('image_1.png'); /* Image générée de l'étudiante avec sa lueur mystère */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Formulaire Glassmorphism ultra-fin pour laisser transparaître le rêve */
        .glass-card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #f59e0b;
            color: #fff;
            box-shadow: none;
        }

        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
        }

        /* Bouton Massif inspiré de ton style hero */
        .btn-claim {
            background: #fff;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border-radius: 50px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-claim:hover {
            background: #f59e0b; /* Amber 500 */
            color: white;
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.3);
        }

        .checkbox-custom {
            accent-color: #f59e0b;
        }

        .cormorant {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>

<div class="bg-mystery">
    <div class="container" style="max-width: 520px;">
        <div class="glass-card text-light">
            
            <div class="text-center mb-5">
                <p class="text-[10px] text-amber-500 uppercase tracking-[0.4em] mb-3">Rejoindre l'accès prioritaire</p>
                <h1 class="h2 cormorant mb-3">Le luxe à prix <span class="italic text-amber-500">étudiant</span>.</h1>
                <p class="text-white-50 small max-w-sm mx-auto">Validez votre profil pour débloquer les Mystery Boxes et les ventes privées (-70%).</p>
            </div>

            <form action="merci.html">
                <div class="mb-3">
                    <label class="form-label">Nom complet</label>
                    <input class="form-control" type="text" placeholder="Ex: Marie Durant" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email de l'école</label>
                    <input class="form-control" type="email" placeholder="nom@mon-ecole.fr" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Quel sac vous fait rêver ?</label>
                    <select class="form-select text-white-50">
                        <option selected disabled>Choisir un style...</option>
                        <option>Iconiques (Chanel, LV, Gucci)</option>
                        <option>Minimalistes (Celine, Polène)</option>
                        <option>Vintage & Pépites à < 300€</option>
                    </select>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input checkbox-custom" type="checkbox" id="newsletter" required>
                    <label class="form-check-label small text-white-50" for="newsletter">
                        Je veux recevoir les <strong>Mystery Boxes</strong> d'authentification et les alertes VIP (jusqu'à -70%).
                    </label>
                </div>

                <button class="btn btn-claim w-100 mb-3" type="submit">
                    Ouvrir mes privilèges
                </button>

                <div class="text-center mt-3">
                    <a href="index.html" class="text-white-30 text-decoration-none small">← Retour au site</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
