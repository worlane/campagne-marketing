<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Segundo Primo | Accès Privilège</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* L'image de fond immersive */
        .bg-mystery {
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1547949003-9792a18a2601?auto=format&fit=crop&w=1920&q=90');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Carte avec effet Verre Givré (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            color: white;
        }

        /* Champs de saisie - Visibilité accrue */
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff !important;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.9rem;
        }

        /* CORRECTION : Placeholder en blanc pour plus de visibilité */
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.9) !important;
            opacity: 1; /* Firefox */
        }

        .form-control:focus, .form-select:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #f59e0b; 
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            outline: none;
        }

        .form-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
            color: #fff; /* Texte de label en blanc pur */
            margin-bottom: 8px;
        }

        /* Votre Bouton Massif Iconique */
        .btn-luxury-form {
            background: #fff;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border-radius: 500px;
            padding: 22px;
            font-size: 1rem;
            border: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-luxury-form:hover {
            transform: scale(1.03);
            background-color: #f59e0b;
            color: white;
            box-shadow: 0 20px 40px rgba(245, 158, 11, 0.4);
        }

        .cormorant {
            font-family: 'Playfair Display', serif;
        }

        .form-check-input:checked {
            background-color: #f59e0b;
            border-color: #f59e0b;
        }
    </style>
</head>
<body>

<div class="bg-mystery">
    <div class="container" style="max-width: 550px;">
        <div class="glass-card">
            
           <div class="text-center mb-5">
    <span class="text-amber-500 text-[10px] font-bold uppercase tracking-[0.4em]">Communauté Segundo Primo</span>
    <h1 class="h2 cormorant mt-2 mb-3">Le luxe sans le <span class="italic font-light">découvert.</span></h1>
    
    <p class="small text-white px-4 leading-relaxed">
        <span class="opacity-80 font-light">Inscrivez-vous pour</span> 
        <span class="text-amber-500 font-bold tracking-wide underline decoration-amber-500/30 underline-offset-4">
            débloquer les Mystery Boxes
        </span> 
        <span class="opacity-80 font-light">et vos accès prioritaires aux</span> 
        <span class="italic cormorant text-amber-200">ventes privées ✨</span>
    </p>
</div>

            <form action="checkout.html">
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">Nom complet</label>
                        <input class="form-control" type="text" placeholder="Marie Durant" required>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Email Universitaire</label>
                        <input class="form-control" type="email" placeholder="marie@sciencespo.fr" required>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label">Votre style de sac idéal</label>
                        <select class="form-select">
                            <option selected disabled style="color: black;">Choisir une catégorie...</option>
                            <option style="color: black;">Les Iconiques (Timeless)</option>
                            <option style="color: black;">Les Minimalistes (Quiet Luxury)</option>
                            <option style="color: black;">Pépites Vintage < 300€</option>
                        </select>
                    </div>
                </div>

                <div class="form-check mb-5">
                    <input class="form-check-input" type="checkbox" id="newsletter" required>
                    <label class="form-check-label small text-white ms-2" for="newsletter">
                        Je consens à recevoir les surprises et les alertes cadeaux par mail.
                    </label>
                </div>

            
                    <button class="btn-luxury-form w-100">
                    Trouver mon sac
                    </button>
                
        

                <div class="text-center mt-4">
                    <a href="index.html" class="text-white text-decoration-none text-[10px] uppercase tracking-widest opacity-60 hover:opacity-100 transition">
                        ← Retour à l'accueil
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
